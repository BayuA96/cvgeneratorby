<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CV Generator Pro - By Bayu</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- html2canvas untuk export ke JPG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          screens: {
            'xs': '475px',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Ukuran Kertas A4 Presisi (210mm x 297mm) */
    .a4-page {
      width: 210mm;
      min-width: 210mm;
      height: 297mm;
      min-height: 297mm;
      box-sizing: border-box;
      background-color: #ffffff !important;
      color: #1e293b;
      overflow: hidden;
      margin: 0 auto;
      position: relative;
    }

    /* Variabel Warna Dinamis */
    :root {
      --primary-color: #00224d;
      --accent-color: #2563eb;
      --preview-scale: 0.8;
    }

    .bg-theme-primary { background-color: var(--primary-color); }
    .text-theme-primary { color: var(--primary-color); }
    .border-theme-primary { border-color: var(--primary-color); }
    
    .bg-theme-accent { background-color: var(--accent-color); }
    .text-theme-accent { color: var(--accent-color); }

    /* Print Setup */
    @media print {
      body { background: #ffffff; margin: 0; padding: 0; }
      body * { visibility: hidden; }
      #cv-preview, #cv-preview * { visibility: visible; }
      #cv-preview {
        position: absolute;
        left: 0;
        top: 0;
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
        transform: none !important;
      }
    }

    /* Floating Loading Overlay */
    #loading-overlay {
      display: none;
      backdrop-filter: blur(8px);
    }
    #loading-overlay.active {
      display: flex;
    }

    /* Dynamic Scaling Wrapper for Responsive Live Preview */
    .preview-stage {
      width: calc(210mm * var(--preview-scale));
      height: calc(297mm * var(--preview-scale));
      position: relative;
      transition: width 0.2s ease, height 0.2s ease;
    }

    #cv-preview {
      transform: scale(var(--preview-scale));
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Responsive Scaling Calculations */
    @media (max-width: 480px) {
      :root { --preview-scale: 0.38; }
    }
    @media (min-width: 481px) and (max-width: 640px) {
      :root { --preview-scale: 0.48; }
    }
    @media (min-width: 641px) and (max-width: 1023px) {
      :root { --preview-scale: 0.62; }
    }
    @media (min-width: 1024px) and (max-width: 1279px) {
      :root { --preview-scale: 0.52; }
    }
    @media (min-width: 1280px) and (max-width: 1535px) {
      :root { --preview-scale: 0.68; }
    }
    @media (min-width: 1536px) {
      :root { --preview-scale: 0.82; }
    }
  </style>
</head>

  <script>
    let experiences = [];
    let educations = [];
    let photoBase64 = null;
    let currentTemplate = 'modern';
    let primaryColor = '#00224d';
    let accentColor = '#2563eb';

    // FUNGSI SANITASI XSS (HTML ESCAPING)
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Switch Tab Mode di Layar Kecil / Mobile
    function switchTab(tab) {
      const formSec = document.getElementById('section-form');
      const prevSec = document.getElementById('section-preview');
      const btnForm = document.getElementById('btn-tab-form');
      const btnPrev = document.getElementById('btn-tab-preview');

      if (tab === 'form') {
        formSec.classList.remove('hidden');
        formSec.classList.add('block');
        prevSec.classList.add('hidden');
        prevSec.classList.remove('flex');
        btnForm.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-md transition-all duration-200";
        btnPrev.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all duration-200";
      } else {
        formSec.classList.add('hidden');
        formSec.classList.remove('block');
        prevSec.classList.remove('hidden');
        prevSec.classList.add('flex');
        btnPrev.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-md transition-all duration-200";
        btnForm.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all duration-200";
      }
    }

    function changeTemplate(templateName) {
      currentTemplate = templateName;
      updateCV();
    }

    function changeColor(primary, accent) {
      primaryColor = primary;
      accentColor = accent;
      document.documentElement.style.setProperty('--primary-color', primary);
      document.documentElement.style.setProperty('--accent-color', accent);
      updateCV();
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        // Validasi tipe file agar hanya gambar

          photoBase64 = e.target.result;

    // Download JPG
    function downloadJPG() {
      const loadingOverlay = document.getElementById('loading-overlay');
      loadingOverlay.classList.add('active');

      const originalElement = document.getElementById('cv-preview');
      const nameInput = document.getElementById('input-name').value;
      const fileName = nameInput ? `CV_${nameInput.replace(/\s+/g, '_')}.jpg` : 'CV_Document.jpg';

      // 1. Buat kontainer pembungkus sementara di luar layar (off-screen)
      const container = document.createElement('div');
      container.style.position = 'absolute';
      container.style.left = '-9999px';
      container.style.top = '-9999px';
      container.style.width = '210mm';
      container.style.height = '297mm';
      
      // 2. Clone elemen CV dan bersihkan properti transform
      const clone = originalElement.cloneNode(true);
      clone.style.transform = 'none';
      clone.style.margin = '0';
      clone.style.display = 'flex';
      clone.style.visibility = 'visible';
      clone.style.opacity = '1';

      container.appendChild(clone);
      document.body.appendChild(container);

      // 3. Ekspor ke JPG menggunakan html2canvas
      html2canvas(clone, {
        scale: 2,
        useCORS: true,
        logging: false,
        width: 794,
        height: 1123,
        windowWidth: 794,
        windowHeight: 1123,
        backgroundColor: '#ffffff'
      }).then((canvas) => {
        const link = document.createElement('a');
        link.download = fileName;
        link.href = canvas.toDataURL('image/jpeg', 0.98);
        link.click();

        document.body.removeChild(container);
        loadingOverlay.classList.remove('active');
      }).catch((err) => {
        console.error("Gagal mengekspor JPG:", err);
        if (document.body.contains(container)) {
          document.body.removeChild(container);
        }
        loadingOverlay.classList.remove('active');
        alert("Terjadi kesalahan saat mengunduh JPG. Silakan coba lagi.");
      });
    }

    // Inisialisasi awal
    addEducation();
    addExperience();
  </script>
</body>
</html>
