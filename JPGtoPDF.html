<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Content Security Policy untuk mencegah injeksi script yang tidak diinginkan -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://cdn.tailwindcss.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.tailwindcss.com;">
  <title>Konverter JPG ke PDF Modern</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div class="bg-white/95 backdrop-blur-md w-full max-w-md rounded-2xl shadow-2xl border border-slate-200/50 p-6 sm:p-8">
    
    <!-- Header Section -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 mb-3 shadow-sm">
        <i class="fa-solid fa-file-pdf text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">JPG ke PDF</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">Ubah gambar JPG kamu menjadi dokumen PDF instan</p>
    </div>

    <!-- Upload Area / Dropzone -->
    <div class="space-y-4">
      <label for="imageInput" class="group relative flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-slate-300 rounded-xl hover:border-indigo-500 hover:bg-indigo-50/50 transition cursor-pointer overflow-hidden">
        
        <!-- Default State -->
        <div id="uploadPlaceholder" class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
          <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 group-hover:text-indigo-600 group-hover:scale-110 transition mb-2"></i>
          <p class="text-xs sm:text-sm text-slate-600 font-medium">Klik untuk unggah atau seret file ke sini</p>
          <p class="text-xs text-slate-400 mt-1">Format: JPG atau JPEG (Maks. 10MB)</p>
        </div>

        <!-- Image Preview Container -->
        <img id="previewImage" class="hidden absolute inset-0 w-full h-full object-contain p-2 bg-slate-50" alt="Preview Gambar" />
        
        <input type="file" id="imageInput" class="hidden" accept="image/jpeg, image/jpg" onchange="handleFileSelect(event)">
      </label>

      <!-- Info File Terpilih -->
      <div id="fileInfo" class="hidden items-center justify-between p-3 bg-slate-100 rounded-lg text-xs text-slate-600">
        <span id="fileName" class="truncate font-medium"></span>
        <button onclick="clearSelection()" class="text-slate-400 hover:text-red-500 ml-2">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Action Button -->
      <button onclick="convertJPGtoPDF()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 transition active:scale-[0.98]">
        <i class="fa-solid fa-download"></i>
        <span>Unduh File PDF</span>
      </button>
      <button onclick="window.location.href='index.html'" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 transition active:scale-[0.98]">
        <i class="fa-solid fa-home"></i>
        <span>Kembali Membuat CV</span>
      </button>
    </div>

    <!-- Footer -->
    <p class="text-center text-[11px] text-slate-400 mt-6">Proses konversi dilakukan langsung di peramban kamu secara aman.</p>
  </div>

  <script>
    const MAX_FILE_SIZE = 10 * 1024 * 1024; // Limit 10 MB
    const ALLOWED_TYPES = ['image/jpeg', 'image/jpg'];
    let objectUrl = null;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Validasi tipe file
      if (!ALLOWED_TYPES.includes(file.type.toLowerCase())) {
        alert('Format file tidak valid! Harap pilih gambar dengan format JPG atau JPEG.');
        clearSelection();
        return;
      }

      // Validasi ukuran file
      if (file.size > MAX_FILE_SIZE) {
        alert('Ukuran file terlalu besar! Maksimal ukuran file adalah 10MB.');
        clearSelection();
        return;
      }

      // Bersihkan memory URL lama jika ada
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
      }

      objectUrl = URL.createObjectURL(file);
      const preview = document.getElementById('previewImage');
      const placeholder = document.getElementById('uploadPlaceholder');
      const fileInfo = document.getElementById('fileInfo');
      const fileName = document.getElementById('fileName');

      preview.src = objectUrl;
      preview.classList.remove('hidden');
      placeholder.classList.add('hidden');
      
      fileName.textContent = file.name;
      fileInfo.classList.remove('hidden');
      fileInfo.classList.add('flex');
    }

    function clearSelection() {
      const input = document.getElementById('imageInput');
      const preview = document.getElementById('previewImage');
      const placeholder = document.getElementById('uploadPlaceholder');
      const fileInfo = document.getElementById('fileInfo');
      
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }

      input.value = '';
      preview.src = '';
      preview.classList.add('hidden');
      placeholder.classList.remove('hidden');
      fileInfo.classList.add('hidden');
      fileInfo.classList.remove('flex');
    }

    async function convertJPGtoPDF() {
      const input = document.getElementById('imageInput');
      if (!input.files || !input.files[0]) {
        alert('Silakan pilih gambar JPG terlebih dahulu!');
        return;
      }

      const file = input.files[0];

      // Re-validate keamanan file saat eksekusi konversi
      if (!ALLOWED_TYPES.includes(file.type.toLowerCase()) || file.size > MAX_FILE_SIZE) {
        alert('File tidak valid atau melebihi batas ukuran.');
        return;
      }

      const img = new Image();
      const currentUrl = URL.createObjectURL(file);

      img.onload = function() {
        try {
          const { jsPDF } = window.jspdf;
          const orientation = img.width > img.height ? 'l' : 'p';
          const pdf = new jsPDF(orientation, 'px', [img.width, img.height]);

          pdf.addImage(img, 'JPEG', 0, 0, img.width, img.height);
          
          // Sanitasi nama file output
          const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_").replace(/\.[^/.]+$/, "");
          pdf.save(safeName + ".pdf");
        } catch (err) {
          alert('Gagal mengonversi file. Pastikan gambar tidak rusak.');
        } finally {
          URL.revokeObjectURL(currentUrl);
        }
      };

      img.onerror = function() {
        alert('Gambar rusak atau tidak dapat dimuat.');
        URL.revokeObjectURL(currentUrl);
      };

      img.src = currentUrl;
    }
  </script>
</body>
</html>
